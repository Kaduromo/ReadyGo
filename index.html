<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ready Go Trainer Pro</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at top, #0b1020, #05060c);
        color: #fff;
        padding: 20px;
    }

    .card {
        width: 380px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(20px);
        border-radius: 22px;
        padding: 28px;
        text-align: center;
        box-shadow: 0 25px 80px rgba(0,0,0,0.7);
        position: relative;
        overflow: hidden;
    }

    .card::before {
        content: "";
        position: absolute;
        inset: -2px;
        background: radial-gradient(circle at top, rgba(0,255,255,0.15), transparent 60%);
        pointer-events: none;
    }

    h1 {
        font-size: 30px;
        margin-bottom: 6px;
        letter-spacing: 1px;
    }

    .subtitle {
        font-size: 12px;
        opacity: 0.6;
        margin-bottom: 10px;
    }

    /* Стиль для селекта */
    select {
        margin-top: 10px;
        padding: 4px 8px;
        border-radius: 6px;
        border: none;
        font-size: 14px;
    }

    .status {
        font-size: 13px;
        opacity: 0.8;
        margin-bottom: 10px;
        min-height: 18px;
    }

    .countdown {
        font-size: 52px;
        font-weight: 800;
        margin: 18px 0;
        color: #00f5ff;
        text-shadow: 0 0 30px rgba(0,245,255,0.5);
        transition: transform 0.1s ease;
    }

    .pulse {
        transform: scale(1.15);
    }

    .btns {
        display: flex;
        gap: 10px;
        margin-top: 14px;
    }

    button {
        flex: 1;
        padding: 12px;
        border-radius: 14px;
        border: none;
        cursor: pointer;
        font-weight: 800;
        font-size: 14px;
        transition: 0.2s;
    }

    .start {
        background: linear-gradient(135deg,#00c6ff,#0072ff);
        color: #fff;
    }

    .stop {
        background: linear-gradient(135deg,#ff416c,#ff4b2b);
        color: #fff;
    }

    button:hover {
        transform: translateY(-1px);
        filter: brightness(1.1);
    }

    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
    }

    .hint {
        margin-top: 14px;
        font-size: 11px;
        opacity: 0.5;
    }
</style>
</head>
<body>

<div class="card">
    <h1>READY GO</h1>
    <div class="subtitle">2–2.5 sec interval • x3–x6 speed • referee mode</div>

    <!-- Выпадающий список для выбора скорости -->
    <div style="margin-top: 14px;">
        <label for="speedSelect">Скорость: </label>
        <select id="speedSelect">
            <option value="1">1</option>
            <option value="1.5" selected>1.5</option>
            <option value="2">2</option>
            <option value="2.5">2.5</option>
            <option value="3">3</option>
            <option value="3.5">3.5</option>
            <option value="4">4</option>
            <option value="4.5">4.5</option>
            <option value="5">5</option>
            <option value="5.5">5.5</option>
            <option value="6">6</option>
            <option value="6.5">6.5</option>
            <option value="7">7</option>
        </select>
    </div>

    <div class="status" id="status">Idle</div>
    <div class="countdown" id="countdown">—</div>

    <div class="btns">
        <button id="startBtn" class="start">Start</button>
        <button id="stopBtn" class="stop" disabled>Stop</button>
    </div>

    <div class="hint">Armwrestling referee simulation</div>
</div>

<script>
const MIN = 2000;
const MAX = 2500;

let running = false;
let tick = null;
let voiceIndex = 0;
let voices = [];

const statusEl = document.getElementById('status');
const countdownEl = document.getElementById('countdown');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const speedSelect = document.getElementById('speedSelect');

let currentSpeed = parseFloat(speedSelect.value);

// Обновляем текущую скорость при изменении селекта
speedSelect.onchange = () => {
    currentSpeed = parseFloat(speedSelect.value);
};

function loadVoices() {
    voices = speechSynthesis.getVoices().filter(v => v.lang.includes('en'));
    if (!voices.length) voices = speechSynthesis.getVoices();
}

speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function getVoice() {
    if (!voices.length) return null;
    const v = voices[voiceIndex % voices.length];
    voiceIndex++;
    return v;
}

function pulse() {
    countdownEl.classList.remove('pulse');
    void countdownEl.offsetWidth;
    countdownEl.classList.add('pulse');
}

// Используем текущую выбранную скорость
function speak() {
    const styles = [
        "READY GO!",
        "GOU!",
        "Ready Go!",
        "READY GO!",
        "GOU!",
        "Ready Go!",
    ];

    const text = styles[Math.floor(Math.random() * styles.length)];

    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.volume = 1;
    u.rate = currentSpeed;

    const v = getVoice();
    if (v) u.voice = v;

    speechSynthesis.cancel();
    speechSynthesis.speak(u);

    statusEl.textContent = "Ref: " + text + " (x" + u.rate.toFixed(1) + ")";
}

function schedule() {
    if (!running) return;

    const delay = Math.random() * (MAX - MIN) + MIN;
    let left = delay / 1000;

    clearInterval(tick);

    tick = setInterval(() => {
        left -= 0.1;
        countdownEl.textContent = left.toFixed(1) + 's';
        pulse();

        if (left <= 0) {
            clearInterval(tick);
            countdownEl.textContent = '0.0s';
            pulse();

            speak();
            setTimeout(schedule, 400);
        }
    }, 100);
}

function start() {
    running = true;
    statusEl.textContent = 'Running...';
    startBtn.disabled = true;
    stopBtn.disabled = false;
    schedule();
}

function stop() {
    running = false;
    clearInterval(tick);
    speechSynthesis.cancel();

    startBtn.disabled = false;
    stopBtn.disabled = true;

    statusEl.textContent = 'Stopped';
    countdownEl.textContent = '—';
}

startBtn.onclick = start;
stopBtn.onclick = stop;
</script>

</body>
</html>
